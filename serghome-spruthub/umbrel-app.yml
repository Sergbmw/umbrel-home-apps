description: >-
  Неофициальный пакет для переноса существующей установки Sprut.hub. ПО и
  лицензия в пакет не входят: необходимы собственный образ и действующая
  лицензия. Для Zigbee требуется совместимый координатор. Производитель
  поддерживает фирменные стики Sprut; сторонние координаторы могут работать,
  но не поддерживаются производителем. Запуск на Mac mini и в Docker
  экспериментальный и не поддерживается Sprut.hub.
