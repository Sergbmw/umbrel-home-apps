version: "3.7"
services:
  server:
    image: koush/scrypted:v0.147.0-noble-full@sha256:e78b4fcecdd6c61acaaf22b50ccef303c738da58cc0be57afdb116521df52296
    network_mode: host
    restart: unless-stopped
    environment:
      SCRYPTED_VOLUME: /server/volume
      SCRYPTED_DOCKER_AVAHI: "true"
      TZ: Europe/Chisinau
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - ${APP_DATA_DIR}/data/volume:/server/volume
