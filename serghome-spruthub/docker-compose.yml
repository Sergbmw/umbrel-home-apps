version: '3.7'
services:
  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:17777:8080"
    command:
      - /bin/sh
      - -ec
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          return 302 http://$$host:7777$$request_uri;
        }
        EOF
        exec nginx -g 'daemon off;'
    restart: unless-stopped
  server:
    image: 127.0.0.1:15000/spruthub:3.0.0-beta-r20131-x64@sha256:5fac3ab5775cc5e11c66f460922d0428b7fe6fad88a80c15097ee9c905e1560f
    platform: linux/amd64
    init: true
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/spruthub-usb-3:/dev/ttyUSB0:rwm
      - /dev/spruthub-usb-4:/dev/ttyUSB1:rwm
    group_add: ['20']
    volumes:
      - type: bind
        source: /home/umbrel/umbrel/external/USB
        target: /media/usb1
        bind:
          create_host_path: false
      - spruthub-data:/home/makesimple
      - /home/umbrel/spruthub-docker/backups:/home/makesimple/.Backup
      - /etc/machine-id:/etc/machine-id:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
volumes:
  spruthub-data:
    external: true
    name: spruthub-data
