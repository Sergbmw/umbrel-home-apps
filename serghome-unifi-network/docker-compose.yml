version: "3.7"
services:
  gateway:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "127.0.0.1:18444:8080"
    command:
      - /bin/sh
      - -ec
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 8080;
          return 302 https://$$host:8443$$request_uri;
        }
        EOF
        exec nginx -g 'daemon off;'
    restart: unless-stopped
  server:
    image: linuxserver/unifi-network-application:10.6.109@sha256:8389f585c6443af7051b4696a09e4bb5408636da7f99c5a0e5a883595c1d434c
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: ${APP_DATA_DIR}/data/controller.env
        format: raw
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    depends_on:
      - mongodb
  mongodb:
    image: mongo:7.0.41-jammy@sha256:52ba5332636758f2375228827d5cf7460e25c02063ba19c243e5d262cf4e7924
    network_mode: host
    command: ["mongod", "--bind_ip", "127.0.0.1"]
    restart: unless-stopped
    env_file:
      - path: ${APP_DATA_DIR}/data/mongodb.env
        format: raw
    volumes:
      - ${APP_DATA_DIR}/data/db:/data/db
      - ${APP_DATA_DIR}/data/configdb:/data/configdb
      - ${APP_DATA_DIR}/data/init:/docker-entrypoint-initdb.d
